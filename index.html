<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Tablet Dashboard Test</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", Arial, sans-serif;
      background: #0b1020;
      color: #f8fafc;
    }
    .dashboard {
      height: 100vh;
      padding: 18px;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(300px, .85fr);
      gap: 18px;
    }
    .card {
      border-radius: 24px;
      overflow: hidden;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.11);
      box-shadow: 0 16px 50px rgba(0,0,0,.22);
    }
    .photo-card { position: relative; min-width: 0; }
    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
      background-size: cover;
      background-position: center;
      transform: scale(1.01);
    }
    .slide.active { opacity: 1; }
    .slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.06), rgba(0,0,0,.08) 52%, rgba(0,0,0,.58));
    }
    .s1 {
      background-image:
        linear-gradient(135deg, rgba(17,94,89,.25), rgba(30,64,175,.12)),
        url("https://picsum.photos/id/1018/1600/1000");
    }
    .s2 {
      background-image:
        linear-gradient(135deg, rgba(88,28,135,.20), rgba(190,24,93,.10)),
        url("https://picsum.photos/id/1015/1600/1000");
    }
    .s3 {
      background-image:
        linear-gradient(135deg, rgba(120,53,15,.18), rgba(22,101,52,.12)),
        url("https://picsum.photos/id/1016/1600/1000");
    }
    .photo-info {
      position: absolute;
      z-index: 3;
      left: 28px;
      right: 28px;
      bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
    }
    .photo-title { font-size: clamp(26px, 3vw, 48px); font-weight: 700; letter-spacing: .02em; }
    .photo-sub { margin-top: 6px; color: rgba(255,255,255,.76); font-size: 15px; }
    .dots { display: flex; gap: 8px; padding-bottom: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 999px; background: rgba(255,255,255,.35); }
    .dot.active { width: 24px; background: rgba(255,255,255,.9); }

    .side {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
    }
    .clock-card { padding: 24px 24px 20px; }
    #time { font-size: clamp(52px, 6vw, 92px); line-height: .95; font-weight: 750; letter-spacing: -.055em; }
    #date { margin-top: 13px; font-size: 18px; color: #cbd5e1; }
    .status { margin-top: 17px; display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.09);
      color: #dbeafe;
    }

    .todo-card { padding: 22px; overflow: auto; }
    .todo-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .todo-header h2 { margin: 0; font-size: 22px; }
    #count { color: #94a3b8; font-size: 13px; }
    #todoList { display: grid; gap: 9px; }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 48px;
      padding: 11px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,.055);
    }
    .todo-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: #60a5fa; flex: 0 0 auto; }
    .todo-text { flex: 1; font-size: 16px; line-height: 1.35; }
    .todo-item.done .todo-text { text-decoration: line-through; color: #64748b; }
    .delete {
      border: 0; background: transparent; color: #64748b; font-size: 18px; cursor: pointer;
    }
    .add-row { margin-top: 13px; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    #newTodo {
      width: 100%;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: white;
      border-radius: 12px;
      padding: 12px 13px;
      font-size: 15px;
      outline: none;
    }
    #newTodo::placeholder { color: #64748b; }
    #addBtn {
      border: 0;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      background: #f8fafc;
      color: #0f172a;
    }
    .footer-card {
      padding: 15px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 13px;
    }
    .online { color: #86efac; }

    @media (max-width: 820px) {
      html, body { overflow: auto; }
      .dashboard { height: auto; min-height: 100vh; grid-template-columns: 1fr; }
      .photo-card { min-height: 52vh; }
      .side { grid-template-rows: auto auto auto; }
    }
  </style>
</head>
<body>
  <main class="dashboard">
    <section class="card photo-card" aria-label="照片轮播">
      <div class="slide s1 active"></div>
      <div class="slide s2"></div>
      <div class="slide s3"></div>
      <div class="photo-info">
        <div>
          <div class="photo-title">Tablet Dashboard</div>
          <div class="photo-sub">测试版 · 图片每 6 秒自动切换</div>
        </div>
        <div class="dots" aria-hidden="true">
          <span class="dot active"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
    </section>

    <section class="side">
      <div class="card clock-card">
        <div id="time">--:--</div>
        <div id="date">正在读取日期…</div>
        <div class="status">
          <span class="chip">平板信息屏</span>
          <span class="chip">HTML / CSS / JS</span>
          <span class="chip">本地保存 To-do</span>
        </div>
      </div>

      <div class="card todo-card">
        <div class="todo-header">
          <h2>Today</h2>
          <span id="count"></span>
        </div>
        <div id="todoList"></div>
        <div class="add-row">
          <input id="newTodo" maxlength="80" placeholder="添加一个任务…" />
          <button id="addBtn">添加</button>
        </div>
      </div>

      <div class="card footer-card">
        <span>EdgeOne Makers 测试页面</span>
        <span class="online">● Ready</span>
      </div>
    </section>
  </main>

  <script>
    // 时钟
    function updateClock() {
      const now = new Date();
      document.getElementById("time").textContent =
        now.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
      document.getElementById("date").textContent =
        now.toLocaleDateString("zh-CN", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // 照片轮播
    const slides = [...document.querySelectorAll(".slide")];
    const dots = [...document.querySelectorAll(".dot")];
    let slideIndex = 0;
    setInterval(() => {
      slides[slideIndex].classList.remove("active");
      dots[slideIndex].classList.remove("active");
      slideIndex = (slideIndex + 1) % slides.length;
      slides[slideIndex].classList.add("active");
      dots[slideIndex].classList.add("active");
    }, 6000);

    // To-do：保存在这台设备的浏览器 localStorage 中
    const defaultTodos = [
      { text: "测试 EdgeOne 页面", done: false },
      { text: "确认平板横屏显示效果", done: false },
      { text: "下一步替换成自己的照片", done: false }
    ];
    let todos;
    try {
      todos = JSON.parse(localStorage.getItem("tablet-dashboard-todos")) || defaultTodos;
    } catch {
      todos = defaultTodos;
    }

    const list = document.getElementById("todoList");
    const count = document.getElementById("count");

    function save() {
      localStorage.setItem("tablet-dashboard-todos", JSON.stringify(todos));
    }

    function render() {
      list.innerHTML = "";
      todos.forEach((todo, i) => {
        const row = document.createElement("div");
        row.className = "todo-item" + (todo.done ? " done" : "");

        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = todo.done;
        box.addEventListener("change", () => {
          todos[i].done = box.checked;
          save();
          render();
        });

        const text = document.createElement("div");
        text.className = "todo-text";
        text.textContent = todo.text;

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "×";
        del.title = "删除";
        del.addEventListener("click", () => {
          todos.splice(i, 1);
          save();
          render();
        });

        row.append(box, text, del);
        list.appendChild(row);
      });
      const left = todos.filter(t => !t.done).length;
      count.textContent = left + " 项未完成";
    }

    function addTodo() {
      const input = document.getElementById("newTodo");
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      input.value = "";
      save();
      render();
    }

    document.getElementById("addBtn").addEventListener("click", addTodo);
    document.getElementById("newTodo").addEventListener("keydown", e => {
      if (e.key === "Enter") addTodo();
    });
    render();
  </script>
</body>
</html>
